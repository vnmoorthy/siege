[project]
name = "siege"
version = "0.1.0"
description = "SIEGE: 200 people vs one agent. A typed action gate that learns from every breach."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=12",
  "pydantic>=2",
  "python-dotenv>=1",
  "httpx>=0.27",
  "anthropic>=1.0",
  "openai>=1.75",
  "weave>=0.51",
  "wandb[sandbox]>=0.30",
  "typesafe-sdk>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
lab = ["marimo>=0.14", "pandas>=2", "altair>=5"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
